<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日ベト双方向翻訳チャット</title>

  <!-- PWA & Mobile Web App settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日ベト翻訳">
  <meta name="theme-color" content="#0084ff">

  <!-- Manifest Link -->
  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary-color: #0084ff;
      --primary-hover: #006bce;
      --text-main: #1c1e21;
      --text-sub: #65676b;
      --border-color: #e4e6eb;
      --chat-user-bg: #0084ff;
      --chat-user-text: #ffffff;
      --chat-bot-bg: #f0f2f5;
      --chat-bot-text: #050505;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      height: 100vh; 
      overflow: hidden; 
    }

    .chat-app { 
      width: 100%; 
      max-width: 600px; 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
      background: var(--card-bg); 
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05); 
    }

    .chat-header { 
      padding: 12px 16px; 
      background: var(--card-bg); 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      z-index: 10; 
    }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .avatar { font-size: 24px; }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .status-online { font-size: 12px; color: #31a24c; }
    .header-actions { display: flex; gap: 8px; }

    .btn-lang, .icon-btn { 
      border: 1px solid var(--border-color); 
      background: #fff; 
      border-radius: 16px; 
      padding: 6px 12px; 
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    .btn-lang:hover, .icon-btn:hover { background: #f0f2f5; }
    .icon-btn { padding: 6px 10px; }

    .control-bar { 
      padding: 8px 12px; 
      background: #fafafa; 
      border-bottom: 1px solid var(--border-color); 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 6px 10px; 
      font-size: 12px; 
    }
    .ctrl-group { display: flex; flex-direction: column; gap: 2px; }
    .ctrl-group label { font-size: 10px; color: var(--text-sub); font-weight: 600; }
    .ctrl-group select { 
      padding: 4px 6px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
      background: #fff; 
      font-size: 12px; 
    }

    .chat-body { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background: #fbfbfb; 
    }

    .system-badge { 
      align-self: center; 
      background: #e4e6eb; 
      color: var(--text-sub); 
      font-size: 12px; 
      padding: 4px 12px; 
      border-radius: 12px; 
      margin: 8px 0; 
      text-align: center; 
      max-width: 90%;
    }
    .error-badge { background: #ffe6e6; color: #d93025; }

    .chat-bubble { 
      max-width: 80%; 
      padding: 10px 14px; 
      border-radius: 18px; 
      font-size: 14px; 
      line-height: 1.4; 
      word-wrap: break-word; 
      white-space: pre-wrap; 
    }
    .user-bubble { 
      align-self: flex-end; 
      background: var(--chat-user-bg); 
      color: var(--chat-user-text); 
      border-bottom-right-radius: 4px; 
    }
    
    .chat-bubble-container { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      max-width: 85%; 
      align-self: flex-start; 
    }
    .bot-bubble { 
      background: var(--chat-bot-bg); 
      color: var(--chat-bot-text); 
      border-bottom-left-radius: 4px; 
      position: relative; 
      min-width: 60px;
    }
    
    .btn-copy { 
      border: none; 
      background: transparent; 
      color: var(--primary-color); 
      font-size: 11px; 
      font-weight: 600; 
      cursor: pointer; 
      align-self: flex-start; 
      margin-top: 4px; 
    }

    .chat-input-bar { 
      padding: 12px; 
      background: var(--card-bg); 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      gap: 8px; 
      align-items: flex-end; 
    }
    .chat-input-bar textarea { 
      flex: 1; 
      border: 1px solid var(--border-color); 
      border-radius: 18px; 
      padding: 8px 14px; 
      font-size: 14px; 
      resize: none; 
      max-height: 100px; 
      outline: none; 
      font-family: inherit; 
    }
    .btn-send { 
      background: var(--primary-color); 
      color: #fff; 
      border: none; 
      border-radius: 18px; 
      padding: 8px 16px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: 14px; 
      height: 36px; 
      transition: background 0.2s;
    }
    .btn-send:disabled { background: #ccc; cursor: not-allowed; }

    /* Streaming Loading Indicator */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Modal Styles */
    .modal { 
      border: none; 
      border-radius: 12px; 
      padding: 0; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
      margin: auto; 
      max-width: 420px; 
      width: 90%; 
    }
    .modal::backdrop { background: rgba(0,0,0,0.4); }
    .modal-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .setting-group { display: flex; flex-direction: column; gap: 6px; }
    .setting-group label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
    .setting-group input, .setting-group select { 
      padding: 8px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
      font-size: 14px; 
    }
    .model-desc-card { 
      font-size: 12px; 
      color: var(--text-sub); 
      background: #f0f2f5; 
      padding: 8px 12px; 
      border-radius: 6px; 
      line-height: 1.4; 
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-primary { 
      background: var(--primary-color); 
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      padding: 8px 16px; 
      cursor: pointer; 
      font-weight: 600; 
    }
    .btn-secondary { 
      background: #e4e6eb; 
      color: var(--text-main); 
      border: none; 
      border-radius: 6px; 
      padding: 8px 16px; 
      cursor: pointer; 
      font-weight: 600; 
    }

    /* API Guide Card */
    .api-guide-card {
      background: #f0f7ff;
      border: 1px solid #bae0ff;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .api-guide-header {
      font-weight: 700;
      color: #0050b3;
      margin-bottom: 6px;
    }
    .api-guide-steps {
      padding-left: 18px;
      margin-bottom: 10px;
      color: #333;
    }

      display: inline-block;

      text-decoration: none;

      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-get-key:hover {
      background: #096dd9;
    }

        networkError: 'Lỗi kết nối mạng. Vui lòng kiểm tra lại đường truyền internet.',
        unknown: 'Đã xảy ra lỗi trong quá trình dịch.'

    // Translator Class (Fast Streaming without JSON)
    class MessageTranslator {
      constructor(modelName = 'gemini-3.5-flash-lite') {
        this.modelName = modelName;
      }

      setModel(modelName) {
        this.modelName = modelName;
      }

      async translateMessageStream(text, apiKey, options = {}, onChunk, retries = 3, delay = 2000) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${this.modelName}:streamGenerateContent?key=${apiKey}&alt=sse`;

        // 直的かつ高速なプレーンテキストプロンプト
        const prompt = `あなたはプロの日ベト双方向通訳・翻訳者です。
条件に従い、以下のテキストを翻訳してください。挨拶や余計な解説は一切含めず、翻訳後の文章のみを直接出力してください。

【設定条件】
- 翻訳方向: ${options.direction || 'auto'}
- トーン: ${options.tone || 'casual'}
- 関係性: ${options.relation || 'general'}
- 方言/スタイル: ${options.dialect || 'standard'}
- 話し手の性別: ${options.speakerGender || 'unspecified'}
- 聞き手の性別: ${options.listenerGender || 'unspecified'}

【入力テキスト】
${text}`;

        for (let attempt = 1; attempt <= retries; attempt++) {
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              const status = response.status;
              const rawMsg = errData.error?.message || '';

              if ((status === 503 || status === 429 || rawMsg.includes('high demand')) && attempt < retries) {
                await new Promise(resolve => setTimeout(resolve, delay * attempt));
                continue;
              }

              if (status === 503 || rawMsg.includes('high demand')) {
                throw new Error('ERR_HIGH_DEMAND');
              } else if (status === 400 || status === 403 || rawMsg.includes('API key')) {
                throw new Error('ERR_INVALID_KEY');
              } else if (status === 429) {
                throw new Error('ERR_RATE_LIMIT');
              } else {
                throw new Error('ERR_UNKNOWN');
              }
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let fullRawText = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (const line of lines) {
                if (line.startsWith('data: ')) {
                  const jsonStr = line.replace(/^data:\s*/, '').trim();
                  if (!jsonStr || jsonStr === '[DONE]') continue;

                  try {
                    const parsed = JSON.parse(jsonStr);
                    const chunkText = parsed.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    if (chunkText) {
                      fullRawText += chunkText;
                      onChunk(fullRawText); // リアルタイムでテキストを画面に直接反映
                    }
                  } catch (e) {
                    // 直前の不完全なデータ行は無視
                  }
                }
              }
            }

            return fullRawText;
          } catch (error) {
            if (attempt === retries) {
              throw error;
            }
            await new Promise(resolve => setTimeout(resolve, delay * attempt));
          }
        }
      }
    }

        copiedText: 'Đã sao chép',
        lblApiGuideTitle: '🔑 Cách lấy API Key miễn phí (mất 1 phút)',
        apiSteps: [
          'Bấm vào nút bên dưới để truy cập Google AI Studio (Đăng nhập Google)',
          'Bấm vào nút 「Create API key」',
          'Sao chép (Copy) mã Key tạo được, dán vào ô bên dưới và bấm 「Lưu」'
        ],
        btnGetKeyText: 'Mở Google AI Studio để lấy Key'
      }
    };

    const modelDescriptions = {
      ja: {
        'gemini-3.5-flash-lite': '🚀 超高速・軽量: 最速レスポンス。一瞬で翻訳結果が表示されます。',
        'gemini-3.6-flash': '🌟 標準推奨: 意図・人称の理解度が最も高く、自然な日常会話に最適です。',
        'gemini-3.5-flash': '⚡ バランス型: 高精度な翻訳と高速なレスポンスを両立したモデルです。'
      },
      vi: {
        'gemini-3.5-flash-lite': '🚀 Siêu nhanh & nhẹ: Phản hồi cực nhanh, hiển thị kết quả gần như ngay lập tức.',
        'gemini-3.6-flash': '🌟 Khuyên dùng: Hiểu xưng hô và ngữ cảnh tốt nhất, tối ưu cho giao tiếp tự nhiên.',
        'gemini-3.5-flash': '⚡ Cân bằng: Tốc độ xử lý nhanh, độ chính xác cao và phản hồi ổn định.'
      }
    };

    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.5-flash-lite';
    const translator = new MessageTranslator(savedModel);

    document.addEventListener('DOMContentLoaded', () => {
      const btnUiLang = document.getElementById('btn-ui-lang');
      const modelSelect = document.getElementById('model-select');
      const settingsModal = document.getElementById('settings-modal');
      const btnOpenSettings = document.getElementById('btn-open-settings');
      const btnCloseModal = document.getElementById('btn-close-modal');
      const btnSaveKey = document.getElementById('btn-save-key');
      const apiKeyInput = document.getElementById('api-key-input');
      
      const btnSend = document.getElementById('btn-send');
      const messageInput = document.getElementById('message-input');

      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey && apiKeyInput) apiKeyInput.value = savedKey;

      applyLanguage(currentUiLang);

      if (btnUiLang) {
        btnUiLang.addEventListener('click', () => {
          currentUiLang = (currentUiLang === 'ja') ? 'vi' : 'ja';
          applyLanguage(currentUiLang);
        });
      }

      if (modelSelect) {
        modelSelect.value = savedModel;
        modelSelect.addEventListener('change', updateModelDescription);
      }

      if (btnOpenSettings && settingsModal) {
        btnOpenSettings.addEventListener('click', () => settingsModal.showModal());
      }
      if (btnCloseModal && settingsModal) {
        btnCloseModal.addEventListener('click', () => settingsModal.close());
      }
      if (btnSaveKey) {
        btnSaveKey.addEventListener('click', () => {
          const key = apiKeyInput ? apiKeyInput.value.trim() : '';
          const selectedModel = modelSelect ? modelSelect.value : savedModel;
          if (key) localStorage.setItem('gemini_api_key', key);
          localStorage.setItem('gemini_model', selectedModel);
          translator.setModel(selectedModel);
          if (settingsModal) settingsModal.close();
        });
      }

      if (btnSend) {
        btnSend.addEventListener('click', handleSendMessage);
      }

      if (messageInput) {
        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
          }
        });
      }
    });

    async function handleSendMessage() {
      const input = document.getElementById('message-input');
      const btnSend = document.getElementById('btn-send');
      const chatBody = document.getElementById('chat-body');
      const t = uiTranslations[currentUiLang];

      const text = input ? input.value.trim() : '';
      if (!text) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert(currentUiLang === 'ja' ? '最初に設定（⚙️）からGemini APIキーを入力してください。' : 'Vui lòng nhập Gemini API Key trong Cài đặt (⚙️) trước.');
        document.getElementById('settings-modal')?.showModal();
        return;
      }

      input.value = '';
      btnSend.disabled = true;
      btnSend.textContent = t.btnSending;

      appendUserBubble(text);

      const direction = document.getElementById('direction-select')?.value || 'auto';
      const tone = document.getElementById('tone-select')?.value || 'casual';
      const relation = document.getElementById('rel-select')?.value || 'general';
      const dialect = document.getElementById('dialect-select')?.value || 'standard';
      const speakerGender = document.getElementById('speaker-gender-select')?.value || 'unspecified';
      const listenerGender = document.getElementById('listener-gender-select')?.value || 'unspecified';

      const { container, textElem, bubble } = createBotBubbleContainer();

      try {
        const rawFullText = await translator.translateMessageStream(
          text, 
          apiKey, 
          { direction, tone, relation, dialect, speakerGender, listenerGender },
          (rawAccumulatedText) => {
            // 受信した文字をリアルタイムに直接流し込み（爆速表示）
            textElem.textContent = rawAccumulatedText;
            chatBody.scrollTop = chatBody.scrollHeight;
          }
        );

        finalizeStreamDisplay(rawFullText, textElem, bubble);

      } catch (err) {
        container.remove();
        appendSystemError(err.message);
      } finally {
        btnSend.disabled = false;
        btnSend.textContent = t.btnSend;
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }

    function appendUserBubble(text) {
      const chatBody = document.getElementById('chat-body');
      const div = document.createElement('div');
      div.className = 'chat-bubble user-bubble';
      div.textContent = text;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function createBotBubbleContainer() {
      const chatBody = document.getElementById('chat-body');

      const container = document.createElement('div');
      container.className = 'chat-bubble-container bot-container';

      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble bot-bubble';

      const textElem = document.createElement('div');
      textElem.className = 'translated-text';
      
      // 最初だけローディング表示
      textElem.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      
      bubble.appendChild(textElem);
      container.appendChild(bubble);

      chatBody.appendChild(container);
      chatBody.scrollTop = chatBody.scrollHeight;

      return { container, bubble, textElem };
    }

    function finalizeStreamDisplay(finalText, textElem, bubble) {
      const t = uiTranslations[currentUiLang];
      textElem.textContent = finalText.trim();

      // コピーボタンの追加
      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-copy';
      copyBtn.textContent = t.copyBtn;
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(finalText.trim()).then(() => {
          copyBtn.textContent = t.copiedText;
          setTimeout(() => { copyBtn.textContent = t.copyBtn; }, 2000);
        });
      });
      bubble.appendChild(copyBtn);
    }

    function appendSystemError(errCode) {
      const chatBody = document.getElementById('chat-body');
      const errDict = localizedErrorMessages[currentUiLang] || localizedErrorMessages.ja;
      
      let displayMsg = errDict.unknown;
      if (errCode === 'ERR_HIGH_DEMAND') {
        displayMsg = errDict.highDemand;
      } else if (errCode === 'ERR_INVALID_KEY') {
        displayMsg = errDict.invalidKey;
      } else if (errCode === 'ERR_RATE_LIMIT') {
        displayMsg = errDict.rateLimit;
      } else if (errCode === 'Failed to fetch') {
        displayMsg = errDict.networkError;
      }

      const div = document.createElement('div');
      div.className = 'system-badge error-badge';
      div.textContent = `⚠️ ${displayMsg}`;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function applyLanguage(lang) {
      const t = uiTranslations[lang];
      if (!t) return;

      const btnUiLang = document.getElementById('btn-ui-lang');
      if (btnUiLang) btnUiLang.textContent = t.btnLangText;

      const headerTitle = document.getElementById('header-title');
      if (headerTitle) headerTitle.textContent = t.headerTitle;

      const headerStatus = document.getElementById('header-status');
      if (headerStatus) headerStatus.textContent = t.headerStatus;

      const lblDirection = document.getElementById('lbl-direction');
      if (lblDirection) lblDirection.textContent = t.lblDirection;
      const dirSelect = document.getElementById('direction-select');
      if (dirSelect) {
        dirSelect.options[0].text = t.optDirectionAuto;
        dirSelect.options[1].text = t.optDirectionJa2Vi;
        dirSelect.options[2].text = t.optDirectionVi2Ja;
      }

      const lblTone = document.getElementById('lbl-tone');
      if (lblTone) lblTone.textContent = t.lblTone;
      const toneSelect = document.getElementById('tone-select');
      if (toneSelect) {
        toneSelect.options[0].text = t.optToneCasual;
        toneSelect.options[1].text = t.optTonePolite;
        toneSelect.options[2].text = t.optToneHonorific;
      }

      const lblRel = document.getElementById('lbl-rel');
      if (lblRel) lblRel.textContent = t.lblRel;
      const relSelect = document.getElementById('rel-select');
      if (relSelect) {
        relSelect.options[0].text = t.optRelGeneral;
        relSelect.options[1].text = t.optRelFriend;
        relSelect.options[2].text = t.optRelLover;
        relSelect.options[3].text = t.optRelColleague;
        relSelect.options[4].text = t.optRelSenior;
        relSelect.options[5].text = t.optRelFamily;
      }

      const lblDialect = document.getElementById('lbl-dialect');
      if (lblDialect) lblDialect.textContent = t.lblDialect;
      const diaSelect = document.getElementById('dialect-select');
      if (diaSelect) {
        diaSelect.options[0].text = t.optDialectStandard;
        diaSelect.options[1].text = t.optDialectNorthern;
        diaSelect.options[2].text = t.optDialectSouthern;
      }

      const lblSpeakerGender = document.getElementById('lbl-speaker-gender');
      if (lblSpeakerGender) lblSpeakerGender.textContent = t.lblSpeakerGender;
      const spkGenSelect = document.getElementById('speaker-gender-select');
      if (spkGenSelect) {
        spkGenSelect.options[0].text = t.optGenderUnspecified;
        spkGenSelect.options[1].text = t.optGenderMale;
        spkGenSelect.options[2].text = t.optGenderFemale;
      }

      const lblListenerGender = document.getElementById('lbl-listener-gender');
      if (lblListenerGender) lblListenerGender.textContent = t.lblListenerGender;
      const lisGenSelect = document.getElementById('listener-gender-select');
      if (lisGenSelect) {
        lisGenSelect.options[0].text = t.optGenderUnspecified;
        lisGenSelect.options[1].text = t.optGenderMale;
        lisGenSelect.options[2].text = t.optGenderFemale;
      }

      const badge = document.getElementById('system-badge');
      if (badge) badge.textContent = t.systemBadge;

      const input = document.getElementById('message-input');
      if (input) input.placeholder = t.placeholderInput;

      const btnSend = document.getElementById('btn-send');
      if (btnSend) btnSend.textContent = t.btnSend;

      const modalTitle = document.getElementById('modal-title');
      if (modalTitle) modalTitle.textContent = t.modalTitle;

      const lblModelSelect = document.getElementById('lbl-model-select');
      if (lblModelSelect) lblModelSelect.textContent = t.lblModelSelect;

      const btnSaveKey = document.getElementById('btn-save-key');
      if (btnSaveKey) btnSaveKey.textContent = t.btnSaveKey;

      const btnCloseModal = document.getElementById('btn-close-modal');
      if (btnCloseModal) btnCloseModal.textContent = t.btnCloseModal;

      const lblApiGuideTitle = document.getElementById('lbl-api-guide-title');
      if (lblApiGuideTitle) lblApiGuideTitle.textContent = t.lblApiGuideTitle;

      const btnGetKeyText = document.getElementById('btn-get-key-text');
      if (btnGetKeyText) btnGetKeyText.textContent = t.btnGetKeyText;

      const apiStepsElem = document.getElementById('api-guide-steps');
      if (apiStepsElem && t.apiSteps) {
        apiStepsElem.innerHTML = t.apiSteps.map(step => `<li>${step}</li>`).join('');
      }

      updateModelDescription();
    }

    function updateModelDescription() {
      const modelSelect = document.getElementById('model-select');
      const modelDescCard = document.getElementById('model-desc-card');
      if (!modelSelect || !modelDescCard) return;

      const selected = modelSelect.value;
      const desc = modelDescriptions[currentUiLang][selected] || modelDescriptions['ja'][selected];
      modelDescCard.textContent = desc;
    }
  </script>
</body>
</html>
